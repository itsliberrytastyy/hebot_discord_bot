name: Bug report
description: The extension does not install, the DSH button is missing, or a DSH does not post.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Two things to check first:

        - **"Manifest file is missing or unreadable"** means the wrong folder was chosen. Choose the folder that has `manifest.json` directly inside it.
        - The [Troubleshooting table](https://github.com/itsliberrytastyy/hebot_discord_bot#troubleshooting) covers the messages the extension itself shows.
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Edge
        - Brave
        - Opera
        - Firefox
        - Firefox ESR
        - Other (name it below)
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser version
      description: "Chrome, Edge, Brave: open `chrome://version`. Firefox: Menu, Help, About Firefox."
      placeholder: "141.0.7390.66"
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: DSH version
      description: "Shown on the trt's card in `hebot.trt` or `about:addons`."
      placeholder: "0.1.8"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - ZIP from the Releases page
        - Code, Download ZIP (the source)
        - git clone
        - Something else (say what below)
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where does it go wrong?
      options:
        - Installing or loading the extension
        - There is no dsh button in the comment box
        - Clicking the DSH button does nothing
        - The picker opens, but search or a pasted link fails
        - Posting the dsh fails
        - Something else
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The steps you took, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Error messages
      description: |
        Copy the exact text of any message, or attach a screenshot. Useful places to look:

        - the red line at the top of the hustle picker
        - the DSH's card in `hustle.dsh` (the **Errors** button)
        - the page console: press F12 on the hustcontrols tab, open **Console**, then repeat the step that fails 
