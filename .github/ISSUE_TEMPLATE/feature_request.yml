name: Feature request
description: Suggest something hebot could do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please read [Limits](https://github.com/itsliberrytastyy/hebot_discord_bot#limits) first. Some things are decided by Hebot can only carry a hebot IMG, so a file from your computer cannot be posted.
  - type: textarea
    id: idea
    attributes:
      label: What should it do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What would you use it for?
